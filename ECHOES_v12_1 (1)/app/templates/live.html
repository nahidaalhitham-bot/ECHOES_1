<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>ECHOES — موقع المريض</title>
<link rel="stylesheet" href="/static/style.css">
<style>
  .live-shell { max-width: 560px; margin: 0 auto; padding: 22px 18px 40px; }
  .live-head { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .dot { width:12px; height:12px; border-radius:50%; background:#8f86e6; }
  .dot.live { background:#1f9d6b; animation:pulse 1.3s infinite; }
  .dot.stale { background:#c9721c; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }
  .big-loc { font-size:20px; font-weight:800; margin:6px 0; }
  .mono { font-family:ui-monospace,monospace; direction:ltr; text-align:left; }
  .clock { color:var(--muted); font-size:14px; }
  .mapbox { background:#f8f9ff; border:1px solid var(--line); border-radius:14px;
            height:300px; overflow:hidden; margin:16px 0; }
  .mapbox iframe { width:100%; height:100%; border:0; }
  .update-note { margin:8px 0 0; font-size:13px; color:var(--muted); }
  .warn { background:var(--warn-soft); color:var(--warn); border:1px dashed #e0b98c;
          padding:12px 14px; border-radius:12px; margin:14px 0; }
  .ok { background:var(--ok-soft); color:#12503a; padding:12px 14px; border-radius:12px; margin:14px 0; }
</style>
</head>
<body>
  <main class="live-shell">
    <div class="live-head">
      <span class="dot" id="dot"></span>
      <strong>ECHOES</strong>
      <span class="clock" id="status">…</span>
    </div>

    <h1 style="margin:0 0 4px;font-size:20px" id="who">موقع المريض</h1>
    <div id="content" class="muted">…جارٍ التحميل</div>
    <div class="mapbox" id="mapbox" hidden aria-label="خريطة الموقع المباشر"></div>
    <p class="update-note">تتحدث الخريطة تلقائيا كل 4 ثوان عند وصول بيانات GPS جديدة.</p>

    <p class="clock" style="margin-top:22px">
      هذه صفحة مشتركة مؤقتة تعرض الموقع فقط. لا بيانات طبية، ولا صور، ولا تفاصيل شخصية.
    </p>
    <p class="clock" id="exp"></p>
  </main>

<script>
const token = location.pathname.split('/').filter(Boolean).pop();
const dot = document.getElementById('dot');
const statusEl = document.getElementById('status');
const who = document.getElementById('who');
const content = document.getElementById('content');
const mapbox = document.getElementById('mapbox');
let lastMapFix = null;
let pollTimer = null;
let expired = false;

function showMap(lat, lon) {
  // OpenStreetMap embedded view centered on the latest reported coordinates.
  const delta = 0.004;
  const bbox = [lon-delta, lat-delta, lon+delta, lat+delta].join(',');
  const src = 'https://www.openstreetmap.org/export/embed.html?bbox=' +
    encodeURIComponent(bbox) + '&layer=mapnik&marker=' + lat + ',' + lon;
  if (lastMapFix === lat + ',' + lon) return;
  lastMapFix = lat + ',' + lon;
  mapbox.innerHTML = '<iframe title="خريطة الموقع" loading="lazy" referrerpolicy="no-referrer" src="' + src + '"></iframe>';
  mapbox.hidden = false;
}

function esc(s) {
  return String(s == null ? '' : s).replaceAll('&','&amp;')
    .replaceAll('<','&lt;').replaceAll('>','&gt;');
}

function render(d) {
  if (!d.ok) {
    dot.className = 'dot stale';
    statusEl.textContent = '';
    content.innerHTML = `<div class="warn">${esc(d.message || 'تعذّر تحميل الموقع')}</div>`;
    mapbox.hidden = true;
    return;
  }
  who.textContent = 'موقع المريض';

  if (d.state === 'inside_zone') {
    dot.className = 'dot live';
    statusEl.textContent = 'داخل النطاق الآمن';
    content.innerHTML = `<div class="ok"><div class="big-loc">🏠 ${esc(d.message)}</div></div>`;
    mapbox.hidden = true;
    return;
  }
  if (!d.location) {
    dot.className = 'dot stale';
    statusEl.textContent = 'لا يوجد موقع';
    content.innerHTML = '<div class="warn">لا يوجد موقع مسجَّل بعد.</div>';
    mapbox.hidden = true;
    return;
  }

  const L = d.location;
  const fresh = L.is_fresh;
  showMap(Number(L.lat), Number(L.lon));
  dot.className = 'dot ' + (fresh ? 'live' : 'stale');
  statusEl.textContent = fresh ? 'الموقع مباشر' : 'آخر موقع معروف';

  content.innerHTML = `
    ${L.simulated ? `<div class="warn">تنبيه: هذا موقع محاكى للاختبار، وليس موقعًا حقيقيًا.</div>` : ''}
    <div class="ok"><div class="big-loc">${fresh ? 'الموقع الحالي' : 'آخر موقع معروف — وليس الحالي'}</div>
      <div class="mono">${L.lat.toFixed(6)}, ${L.lon.toFixed(6)}</div>
      <div class="clock">آخر تحديث: ${esc(L.reported_at)}</div>
    </div>
    ${!fresh ? `<div class="warn">مرّ ${Math.floor((L.age_seconds||0)/60)} دقيقة بدون تحديث.</div>` : ''}
    <a class="btn" style="display:block;text-align:center;text-decoration:none"
       href="${esc(L.map_link)}" target="_blank" rel="noopener noreferrer" referrerpolicy="no-referrer">افتح الخريطة</a>
  `;
  if (d.expires_at) {
    document.getElementById('exp').textContent = 'ينتهي هذا الرابط: ' + d.expires_at;
  }
}

async function tick() {
  if (expired) return;
  try {
    const r = await fetch('/api/public/live/' + encodeURIComponent(token), {
      cache: 'no-store', referrerPolicy: 'no-referrer'
    });
    if (r.status === 404 || r.status === 410) {
      expired = true;
      if (pollTimer) clearInterval(pollTimer);
      dot.className = 'dot stale';
      statusEl.textContent = '';
      content.innerHTML = '<div class="warn">انتهت صلاحية هذا الرابط أو أُلغي.</div>';
      mapbox.hidden = true;
      return;
    }
    if (!r.ok) throw new Error('HTTP ' + r.status);
    render(await r.json());
  } catch (e) {
    dot.className = 'dot stale';
    statusEl.textContent = 'تعذر التحقق من تحديث الموقع';
    const title = content.querySelector('.big-loc');
    if (title) title.textContent = 'آخر موقع معروف — تعذر التحقق من التحديث';
  }
}

tick();
pollTimer = setInterval(tick, 4000);
</script>
</body>
</html>
