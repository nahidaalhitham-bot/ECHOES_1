<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<script src="/static/i18n.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echeos — بطاقة المساعدة</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="patient">
  <main class="shell">
    <h1>أحتاج مساعدة</h1>

    <section class="card-big">
      <div class="card-name" id="name">…</div>
      <div class="card-msg" id="msg">…</div>
      <div class="card-contact">
        <span class="muted small">تواصل مع عائلتي:</span>
        <div id="contact" class="contact-line">…</div>
      </div>
    </section>

    <button id="help" class="help">أرسل طلب مساعدة لعائلتي</button>
    <p class="foot" id="after"></p>
    <p class="foot">تُعرض فقط المعلومات التي وافقت عليها الأسرة.</p>
  </main>

<script>
async function load() {
  const d = await fetch('/api/emergency/card').then(r => r.json());
  document.getElementById('name').textContent = d.first_name;
  document.getElementById('msg').textContent = d.message;
  document.getElementById('contact').textContent = d.contact_name
    ? `${d.contact_name} (${d.contact_relation})`
    : 'لا يوجد رقم مسجَّل';
}

document.getElementById('help').onclick = async () => {
  const r = await fetch('/api/device/help?device_id=1', { method: 'POST' });
  const d = await r.json();
  document.getElementById('after').textContent = d.alert_created
    ? 'تم إرسال طلب المساعدة.'
    : 'عائلتك تعرف بالفعل.';
};

load();
</script>
</body>
</html>
